[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "disputeshield"
version = "0.1.0"
description = "AI-powered chargeback evidence responder — evaluates dispute evidence, drafts response letters, and honestly reports confidence."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Anurag", email = "anur1g5473@users.noreply.github.com"},
]
keywords = ["chargeback", "disputes", "razorpay", "ai", "fintech"]

dependencies = [
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
disputeshield = "agent.__main__:main"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "eval*", "rubric*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
